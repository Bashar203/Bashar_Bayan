<title>بشار &amp; بيان | دعوة خطوبة</title>
<style>
:root{--rose:#bd7886;--deep:#854958;--gold:#b78a51;--paper:#fff8f5;--pink:#f5e3e4}
*{box-sizing:border-box}html{background:#f4e2e3;scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--deep);font-family:Georgia,serif;background:radial-gradient(ellipse at 50% 15%,#fffaf8,#f3dfe1 75%)}
.petal-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:30}.petal{position:absolute;top:-55px;width:17px;height:25px;border-radius:82% 12% 82% 12%;background:linear-gradient(145deg,#fff1f0 0%,#e8b8c2 45%,#c7798c 100%);box-shadow:0 2px 8px #89505d45;filter:drop-shadow(0 2px 3px #8d536044);opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0) scale(.75);opacity:0}8%{opacity:.9}30%{transform:translate3d(calc(var(--sway)*.45),30vh,0) rotate(145deg) scale(1)}62%{transform:translate3d(calc(var(--sway)*-.35),68vh,0) rotate(330deg) scale(.9)}100%{transform:translate3d(var(--sway),112vh,0) rotate(590deg) scale(.7);opacity:.1}}

.screen{min-height:100svh;display:none}.screen.active{display:block}
.welcome{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:0;overflow:hidden}
.welcome-shell{position:relative;width:100vw;max-width:900px;height:100svh;max-height:980px;margin:0 auto;line-height:0;filter:drop-shadow(0 14px 30px #8e596326)}
.welcome-art{display:block;width:100%;height:100%;object-fit:fill;border-radius:0}
.open-hotspot{position:absolute;left:17%;top:89.6%;width:66%;height:5.4%;border:0;border-radius:999px;background:transparent;cursor:pointer;z-index:4;-webkit-tap-highlight-color:transparent}
.open-hotspot:focus-visible{outline:3px solid #b98b50;outline-offset:4px}
.hint{position:absolute;left:50%;top:91%;transform:translateX(-50%);font:12px/1.4 Arial,sans-serif;color:#98616c;background:#fff9f4d9;padding:5px 12px;border-radius:20px;white-space:nowrap;opacity:0;pointer-events:none}
.welcome-shell:focus-within .hint{opacity:1}
.invitation{width:min(100% - 24px,760px);margin:0 auto;padding:22px 0 54px;display:none}.invitation.active{display:block;animation:appear .8s ease both}@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.back-row{display:flex;justify-content:center;margin-bottom:16px}.back-btn{border:1px solid #d5b58d;background:#fff9f4;color:#8d5962;border-radius:999px;padding:9px 19px;font:15px Arial,sans-serif;cursor:pointer;box-shadow:0 4px 13px #8b59621b}
.card-frame{padding:5px;border:1px solid var(--gold);background:linear-gradient(135deg,#f8e9d2,#b98b50 48%,#f5e4c9);box-shadow:0 18px 45px #93636b26}.card-frame img{display:block;width:100%;height:auto}
.count{text-align:center;margin:30px auto 0;padding:0 8px;max-width:650px}.count-title{font:34px/1.35 Georgia,serif;color:var(--deep);margin:0 0 4px}.ornament{color:var(--gold);font-size:21px;margin:0 auto 14px}
.count-wrap{display:flex;direction:rtl;align-items:center;justify-content:center;max-width:590px;margin:0 auto;padding:17px 4px 14px;border-top:1px solid #c8a47c;border-bottom:1px solid #c8a47c;background:transparent;position:relative}
.unit{flex:1;min-width:0;padding:0 4px;position:relative}.unit+.unit:before{content:"✦";position:absolute;right:0;top:34%;font-size:10px;color:#c39b69;transform:translateX(50%)}
.unit b{display:block;font:700 clamp(30px,7vw,48px) Georgia,serif;color:var(--deep);font-variant-numeric:tabular-nums;letter-spacing:1px}.unit span{display:block;font:15px Arial,sans-serif;color:#9c7778;margin-top:5px}
.date-pill{display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,390px);margin:17px auto 0;padding:10px 18px;border:1px solid #c6a078;border-radius:999px;color:#87535b;background:#fff8f3d9;font:17px Arial,sans-serif}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:17px auto 0}.action{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:190px;padding:13px 25px;border:1px solid #f5dfc1;border-radius:999px;color:#fffaf7;text-decoration:none;background:linear-gradient(115deg,#c98f9b,#a96373);box-shadow:0 7px 20px #9a626c22,inset 0 1px #ffffff85;font:600 17px Arial,sans-serif}.action svg{width:19px;height:19px;flex:none}
.footer{text-align:center;margin:25px auto 0;color:#96666c;font:23px/1.6 Georgia,serif}.heart{color:#a85f70;margin:0 8px}.hidden{display:none!important}
@media(min-width:700px){.welcome-shell{width:min(88vw,900px);height:min(92svh,980px)}.invitation{padding-top:30px}}
@media(max-width:420px){.welcome-shell{width:100vw;height:100svh}.invitation{width:calc(100% - 18px)}.count-title{font-size:30px}.unit b{font-size:clamp(27px,8vw,36px)}.unit span{font-size:13px}.date-pill{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="petal-layer" id="petals" aria-hidden="true"></div>
<section class="screen active" id="welcomeScreen" aria-label="صفحة الترحيب">
 <div class="welcome"><div class="welcome-shell">
  <img class="welcome-art" src="first-page-design.jpg" alt="دعوة عائلتي آل العويوي وآل الرجوب">
  <button class="open-hotspot" id="openInvite" type="button" aria-label="افتح الدعوة"></button>
 </div></div>
</section>
<main class="invitation" id="invitationScreen" aria-label="تفاصيل الدعوة">
 <div class="back-row"><button class="back-btn" id="backBtn" type="button">← العودة للصفحة الأولى</button></div>
 <div class="card-frame"><img src="invitation-card.jpg" alt="بطاقة دعوة خطوبة بشار وبيان"></div>
 <section class="count" aria-label="العد التنازلي للمناسبة">
  <h1 class="count-title">موعدنا</h1><div class="ornament">✧ ❀ ✧</div>
  <div class="count-wrap">
   <div class="unit"><b id="days">--</b><span>يوم</span></div><div class="unit"><b id="hours">--</b><span>ساعة</span></div><div class="unit"><b id="minutes">--</b><span>دقيقة</span></div><div class="unit"><b id="seconds">--</b><span>ثانية</span></div>
  </div>
  <div class="date-pill"><span>الثلاثاء، 8 ديسمبر 2026</span><span>▦</span></div>
  <div class="actions">
   <a class="action" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>موقع القاعة</a>
  </div>
  <p class="footer">بارك الله لهما وبارك عليهما<br>وجمع بينهما في خير <span class="heart">♥</span></p>
 </section>
</main>
<script>
const welcome=document.getElementById('welcomeScreen');const invitation=document.getElementById('invitationScreen');
function openInvitation(){welcome.classList.remove('active');invitation.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'','#invitation')}
function backToWelcome(){invitation.classList.remove('active');welcome.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'',location.pathname)}
document.getElementById('openInvite').addEventListener('click',openInvitation);document.getElementById('backBtn').addEventListener('click',backToWelcome);
const target=new Date('2026-12-08T17:30:00+03:00').getTime();function tick(){const diff=Math.max(0,target-Date.now());const v={days:Math.floor(diff/86400000),hours:Math.floor(diff%86400000/3600000),minutes:Math.floor(diff%3600000/60000),seconds:Math.floor(diff%60000/1000)};Object.entries(v).forEach(([id,n])=>document.getElementById(id).textContent=String(n).padStart(2,'0'))}tick();setInterval(tick,1000);
const petals=document.getElementById('petals');for(let i=0;i<54;i++){const p=document.createElement('i');p.className='petal';p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(7+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*24)+'s';p.style.setProperty('--sway',(Math.random()*150-75)+'px');p.style.width=(12+Math.random()*13)+'px';p.style.height=(18+Math.random()*17)+'px';petals.appendChild(p)}

if(location.hash==='#invitation')openInvitation();
</script>
</body></html>
