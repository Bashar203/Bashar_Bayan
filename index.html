<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bd9298"><title>دعوة خاصة | بشار وأميرته</title>
<meta name="description" content="دعوة خاصة لمناسبة سعيدة. يسعدنا حضوركم ومشاركتنا فرحتنا.">
<meta property="og:type" content="website"><meta property="og:title" content="دعوة خاصة لمناسبة سعيدة">
<meta property="og:description" content="يسعدنا حضوركم ومشاركتنا فرحتنا. افتحوا الرابط لاكتشاف الدعوة.">
<meta property="og:image" content="https://bashar203.github.io/Bashar_Bayan/whatsapp-preview.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<style>
:root{--dusty:#bd9298;--burgundy:#793e49;--gold:#c49a61;--cream:#f7e8e3}
*{box-sizing:border-box}html{min-height:100%;background:#d9b2b4;scroll-behavior:smooth}
body{margin:0;min-height:100svh;color:var(--burgundy);font-family:"Noto Naskh Arabic",Amiri,Georgia,serif;background:radial-gradient(ellipse at 50% 25%,#f2dedd 0%,#dfbabe 60%,#bd9298 100%);overflow-x:hidden}
main{position:relative;z-index:1;width:100%;padding:clamp(8px,2vw,24px) 10px 30px;display:flex;flex-direction:column;align-items:center;gap:18px}
.invitation{position:relative;width:min(100%,560px);line-height:0;filter:drop-shadow(0 12px 24px rgba(92,43,51,.20))}
.invitation>img{display:block;width:100%;height:auto;border-radius:2px}
.hidden{display:none!important}
.hotspot{position:absolute;display:block;z-index:5;border-radius:60px;background:transparent;outline-offset:3px}
.hotspot:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--gold)}
.open-hotspot{left:25%;top:78.5%;width:50%;height:6.5%}
.details-hotspot{left:23.5%;top:68.7%;width:53%;height:7.2%;cursor:pointer}
.page-back{position:absolute;z-index:8;top:9px;right:9px;width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(196,154,97,.9);border-radius:50%;background:rgba(248,232,226,.92);color:#793e49;text-decoration:none;font:26px/1 Arial,sans-serif;box-shadow:0 3px 9px #70404a30}
.page-title{position:absolute;z-index:3;top:7.15%;left:19%;width:62%;height:7.1%;display:flex;align-items:center;justify-content:center;line-height:1.2;text-align:center;font-size:clamp(25px,6.2vw,48px);font-weight:700;color:#793e49;text-shadow:0 1px 0 #fff4;background:radial-gradient(ellipse at center,rgba(247,224,220,.99) 0%,rgba(247,224,220,.97) 73%,rgba(247,224,220,0) 100%);pointer-events:none}
.countdown-wrap{position:relative;isolation:isolate;overflow:hidden;width:min(calc(100% - 28px),470px);margin:0 auto 24px;padding:22px 16px 20px;text-align:center;border:1.5px solid #bd925d;border-radius:23px;background:linear-gradient(145deg,#fff5f0 0%,#f4dfdb 48%,#e8c9c8 100%);box-shadow:inset 0 0 0 5px rgba(255,252,247,.82),inset 0 0 0 7px rgba(190,148,94,.28),0 12px 28px rgba(105,54,62,.16)}
.countdown-wrap:before,.countdown-wrap:after{content:"✦";position:absolute;z-index:-1;top:8px;color:#bd925d;font-size:17px;opacity:.8}.countdown-wrap:before{left:18px}.countdown-wrap:after{right:18px}
.kicker{display:inline-block;margin:0 0 15px;padding:7px 24px 8px;border:1px solid rgba(190,148,94,.9);border-radius:999px;background:linear-gradient(180deg,#bd7e87,#914c58);box-shadow:0 3px 9px #69363b2b,inset 0 1px 0 #ffffff55;font-size:clamp(16px,3.8vw,21px);font-weight:700;color:#fff8f0}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;direction:rtl;padding:9px;border:1px solid rgba(190,148,94,.82);border-radius:16px;background:#fffaf699;box-shadow:inset 0 2px 8px #75404510}
.unit{min-width:0;padding:12px 3px 11px;border:1px solid #be945ebd;border-radius:12px;background:linear-gradient(180deg,#fffdfa,#f5e4df);box-shadow:0 3px 8px #6e3b4314,inset 0 1px 0 #fff}
.num{display:block;font:700 clamp(25px,7vw,36px)/1.1 Georgia,serif;color:#783c48;font-variant-numeric:tabular-nums}.label{display:block;margin-top:6px;font-size:13px;font-weight:700;color:#89565b}
.petal{position:fixed;top:-12vh;z-index:9;pointer-events:none;width:15px;height:26px;border-radius:90% 8% 90% 8%;background:linear-gradient(135deg,#f7c8ce,#d78391 55%,#a95769);opacity:.68;box-shadow:inset 2px 1px 3px #ffffffa6,0 2px 5px #5f2a351f;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}50%{transform:translate3d(42px,55vh,0) rotate(210deg)}100%{transform:translate3d(-30px,115vh,0) rotate(420deg)}}
@media(min-width:900px){main{padding-top:24px}.invitation{width:min(48vw,560px)}}
@media(max-width:430px){main{padding:0 0 20px;gap:13px}.invitation{width:100%;filter:none}.page-back{top:7px;right:7px;width:34px;height:34px}.countdown-wrap{width:calc(100% - 30px);padding:19px 11px 17px;margin-bottom:18px}.countdown{gap:6px;padding:7px}.unit{padding:11px 2px 10px}.num{font-size:clamp(23px,7.1vw,30px)}.label{font-size:12px}}
@media(prefers-reduced-motion:reduce){.petal{display:none}html{scroll-behavior:auto}}
</style></head>
<body><div id="petals" aria-hidden="true"></div><main>
<section class="invitation" id="page-one" aria-label="الصفحة الأولى من الدعوة">
<img src="page1.jpg" width="864" height="1536" alt="بطاقة الدعوة الأولى المعتمدة"><a class="hotspot open-hotspot" href="#page-two" aria-label="افتح الدعوة"></a>
</section>
<section class="invitation hidden" id="page-two" aria-label="الصفحة الثانية من الدعوة">
<a class="page-back" href="#page-one" aria-label="العودة للصفحة الأولى" title="العودة للصفحة الأولى">‹</a>
<img src="page2.jpg" width="941" height="1671" alt="بطاقة تفاصيل الخطوبة"><div class="page-title">بشار &amp; أميرته</div>
<a class="hotspot details-hotspot" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener" aria-label="افتح موقع قاعات كريستال على الخريطة"></a>
</section>
<section class="countdown-wrap hidden" id="live-details" aria-label="العد التنازلي للمناسبة">
<h1 class="kicker">باقي على فرحتنا</h1><div class="countdown" aria-live="off">
<div class="unit"><span class="num" id="days">--</span><span class="label">يوم</span></div><div class="unit"><span class="num" id="hours">--</span><span class="label">ساعة</span></div><div class="unit"><span class="num" id="minutes">--</span><span class="label">دقيقة</span></div><div class="unit"><span class="num" id="seconds">--</span><span class="label">ثانية</span></div></div>
</section></main>
<script>
(()=>{const one=document.getElementById('page-one'),two=document.getElementById('page-two'),count=document.getElementById('live-details');let timer=null;
function page2(){one.classList.add('hidden');two.classList.remove('hidden');count.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});runClock()}
function page1(){two.classList.add('hidden');count.classList.add('hidden');one.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});if(timer){clearInterval(timer);timer=null}}
function route(){if(location.hash==='#page-two')page2();else page1()}
document.querySelector('.open-hotspot').addEventListener('click',e=>{e.preventDefault();history.pushState(null,'','#page-two');route()});document.querySelector('.page-back').addEventListener('click',e=>{e.preventDefault();history.pushState(null,'','#page-one');route()});window.addEventListener('popstate',route);window.addEventListener('hashchange',route);
function runClock(){if(timer)return;const target=new Date('2026-12-08T17:30:00+03:00').getTime();function tick(){let d=Math.max(0,target-Date.now());const v={days:Math.floor(d/86400000),hours:Math.floor(d%86400000/3600000),minutes:Math.floor(d%3600000/60000),seconds:Math.floor(d%60000/1000)};for(const k in v)document.getElementById(k).textContent=String(v[k]).padStart(2,'0')}tick();timer=setInterval(tick,1000)}
if(location.hash==='#page-two')page2();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduce){const root=document.getElementById('petals');for(let i=0;i<17;i++){const p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.animationDuration=9+Math.random()*12+'s';p.style.animationDelay=-Math.random()*18+'s';root.appendChild(p)}}})();
</script></body></html>
