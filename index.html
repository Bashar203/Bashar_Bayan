<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<style>
:root{--dusty:#c99da1;--dusty-deep:#b77f89;--wine:#783b49;--gold:#c49a61;--cream:#f8e9e3}
*{box-sizing:border-box}
html{min-height:100%;background:#c99da1;scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;min-height:100svh;color:var(--wine);font-family:"Noto Naskh Arabic",Amiri,Georgia,serif;background:radial-gradient(ellipse at 50% 25%,#f2dddd 0%,#dfbabe 60%,#c99da1 100%);overflow-x:hidden}
main{position:relative;z-index:1;width:100%;min-height:100svh;padding:clamp(8px,1.5vh,18px) clamp(6px,2vw,18px) 22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(8px,1.8vh,16px)}
.invitation{position:relative;width:min(100%,560px);line-height:0;filter:drop-shadow(0 10px 20px rgba(92,43,51,.18))}
.invitation>img{display:block;width:100%;height:auto;border-radius:2px}
#page-two{width:min(100%,560px)}
.hidden{display:none!important}
.cover-bottom{position:relative;width:100%;height:clamp(34px,8vw,58px);margin-top:clamp(3px,1vw,8px);overflow:hidden;line-height:normal;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,#f2d4d4 0%,#d9aeb4 68%,#c99da1 100%);border-radius:0 0 14px 14px;}
.cover-bottom:before{content:"";position:absolute;left:-8%;right:-8%;top:18%;height:62%;border-top:5px solid #e8c88f;border-bottom:3px solid #b98962;border-radius:50% 50% 0 0/70% 70% 0 0;background:linear-gradient(180deg,#f5cbd0 0%,#c7808c 35%,#e9b4bc 58%,#b56f7d 100%);box-shadow:0 -5px 12px #fff7ee88,inset 0 5px 10px #fff8;}
.cover-bottom:after{content:"";position:absolute;left:50%;top:12%;width:clamp(42px,12vw,62px);height:clamp(32px,9vw,46px);transform:translateX(-50%);background:radial-gradient(ellipse at 30% 50%,#f6d2d3 0 23%,#c77e8a 48%,#8d4c5a 72%,transparent 74%),radial-gradient(ellipse at 70% 50%,#f6d2d3 0 23%,#c77e8a 48%,#8d4c5a 72%,transparent 74%);filter:drop-shadow(0 3px 3px #68394455);}
.cover-bottom .bow-knot{position:absolute;z-index:2;left:50%;top:38%;width:15px;height:15px;transform:translateX(-50%) rotate(45deg);border-radius:4px;background:linear-gradient(135deg,#f6dfb5,#b98a4f 55%,#f4d9a7);box-shadow:0 2px 4px #68394466;}
.hotspot{position:absolute;display:block;z-index:5;border-radius:60px;background:transparent;outline-offset:3px}
.hotspot:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--gold)}
.cover-art{position:relative;width:100%;line-height:0}.open-hotspot{left:27%;top:72.2%;width:46%;height:6.2%}
.map-hotspot{left:21.5%;top:68.3%;width:57%;height:5.4%;cursor:pointer}
.page-back{position:absolute;z-index:12;top:clamp(12px,3.2%,24px);left:clamp(12px,3.2%,24px);right:auto;width:clamp(40px,10vw,48px);height:clamp(40px,10vw,48px);display:flex;align-items:center;justify-content:center;border:1.5px solid #e7c58c;border-radius:50%;background:linear-gradient(145deg,rgba(151,67,82,.96),rgba(91,25,42,.96));color:#fff8ef;text-decoration:none;box-shadow:0 3px 10px rgba(74,24,34,.35),inset 0 1px 2px rgba(255,255,255,.35);font-size:0;line-height:1}.page-back:before{content:"←";font-family:Arial,sans-serif;font-size:clamp(24px,6vw,29px);font-weight:400;color:#fff8ef;transform:translateY(-1px)}.page-back:active{transform:scale(.96)}
.countdown-wrap{position:relative;isolation:isolate;overflow:hidden;width:min(calc(100% - 54px),430px);margin:0 auto 18px;padding:14px 12px 13px;text-align:center;border:2px solid #c49a61;border-radius:26px;background:linear-gradient(145deg,#f8e9e3 0%,#edcfcc 52%,#dfb7b8 100%);box-shadow:inset 0 0 0 5px rgba(255,252,247,.78),inset 0 0 0 7px rgba(190,148,94,.25),0 12px 28px rgba(105,54,62,.17)}
.countdown-wrap:before{content:"";position:absolute;inset:7px;border:1px solid rgba(190,148,94,.65);border-radius:19px;pointer-events:none;z-index:-1}
.kicker{display:inline-block;margin:0 0 9px;padding:4px 20px 5px;border:1px solid rgba(190,148,94,.95);border-radius:999px;background:linear-gradient(180deg,#bd8790,#914c58);box-shadow:0 3px 9px #69363b2b,inset 0 1px 0 #ffffff55;font-size:clamp(17px,4vw,22px);font-weight:700;color:#fff8f0}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;direction:rtl;padding:7px;border:1px solid rgba(190,148,94,.9);border-radius:18px;background:#fff8f0a8;box-shadow:inset 0 2px 8px #75404510}
.unit{min-width:0;padding:8px 3px 7px;border:1.5px solid #be945e;border-radius:13px;background:linear-gradient(180deg,#914c58,#743643);box-shadow:0 4px 9px #6e3b4328,inset 0 1px 0 #ffffff55}
.num{display:block;font:700 clamp(23px,6vw,33px)/1.1 Georgia,serif;color:#fff7ef;font-variant-numeric:tabular-nums}
.label{display:block;margin-top:6px;font-size:13px;font-weight:700;color:#f9e8df}
.petal{position:fixed;top:-12vh;z-index:9;pointer-events:none;width:15px;height:26px;border-radius:90% 8% 90% 8%;background:linear-gradient(135deg,#f7c8ce,#d78391 55%,#a95769);opacity:.68;box-shadow:inset 2px 1px 3px #ffffffa6,0 2px 5px #5f2a351f;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}50%{transform:translate3d(42px,55vh,0) rotate(210deg)}100%{transform:translate3d(-30px,115vh,0) rotate(420deg)}}

/* First page only: center the cover in the available screen */
@media (max-width: 600px) {
  main:has(#page-one:not(.hidden)) {
    min-height: 100vh;
    min-height: 100dvh;
    justify-content: center;
  }
}
/* Robust responsive sizing for iOS Safari, Android, tablets and desktop */
#page-one,#page-two{box-sizing:border-box;width:min(100%,560px);max-width:100%;margin-inline:auto}
.cover-art{position:relative;display:block;width:100%;max-width:100%;line-height:0}
.cover-art img,.invitation>img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain}
#page-one .cover-art img{max-height:none}
#page-two>img{max-height:none}
@media(max-width:600px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  main{width:100%;min-height:100vh;min-height:100dvh;padding: max(6px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom));gap:clamp(6px,1vh,10px);align-items:center}
  #page-one,#page-two{width:100%;max-width:100%;margin-inline:auto}
  .invitation{width:100%;max-width:100%;filter:none}
  .cover-art,.cover-art img,.invitation>img{width:100%;max-width:100%;height:auto}
  .cover-art img,.invitation>img{object-fit:contain}
  .cover-bottom{width:100%;height:clamp(28px,7vw,42px);margin-top:3px}
  .cover-bottom:before{border-top-width:3px;border-bottom-width:2px}
  .cover-bottom:after{width:clamp(32px,9vw,44px);height:clamp(24px,6.5vw,34px)}
  .cover-bottom .bow-knot{width:10px;height:10px}
  .countdown-wrap{width:calc(100% - 24px);max-width:430px;margin:0 auto 8px;padding:clamp(8px,2vw,12px) clamp(7px,2vw,10px)}
  .countdown{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(3px,1.2vw,6px);padding:5px}
  .unit{min-width:0;padding:clamp(5px,1.8vw,8px) 2px;border-radius:11px}
  .num{font-size:clamp(19px,5.7vw,29px)}
  .label{font-size:clamp(10px,2.8vw,12px);margin-top:4px}
  .kicker{font-size:clamp(15px,4vw,20px);margin-bottom:7px;padding:4px 15px}
}
@media(min-width:601px){
  main{padding:clamp(16px,3vh,32px) 18px 30px;gap:18px}
  #page-one{width:min(48vw,560px);max-width:calc(100vw - 36px)}
  #page-two{width:min(48vw,560px);max-width:calc(100vw - 36px)}
  .countdown-wrap{width:min(48vw,430px)}
}
@media(max-height:520px) and (orientation:landscape){
  main{padding:8px 10px 18px;gap:10px}
  #page-one{width:min(64vw,460px);max-width:calc(100vw - 20px)}
  #page-two{width:min(58vw,430px);max-width:calc(100vw - 20px)}
  .countdown-wrap{width:min(58vw,390px);padding:8px}
}
@media(prefers-reduced-motion:reduce){.petal{display:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main>
<section class="invitation" id="page-one" aria-label="الصفحة الأولى من الدعوة">
<div class="cover-art"><img src="page1.jpg" width="2130" height="2954" alt="الصفحة الأولى من الدعوة"><a class="hotspot open-hotspot" href="#page-two" aria-label="افتح الدعوة"></a></div>
<div class="cover-bottom" aria-hidden="true"><span class="bow-knot"></span></div>
</section>
<section class="invitation hidden" id="page-two" aria-label="الصفحة الثانية من الدعوة">
<a class="page-back" href="#page-one" aria-label="العودة للصفحة الأولى" title="العودة للصفحة الأولى"></a>
<img src="page2-final.jpg" width="1880" height="3344" alt="تفاصيل دعوة الخطوبة">
<a class="hotspot map-hotspot" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener noreferrer" aria-label="افتح موقع قاعات كريستال على الخريطة"></a>
</section>
<section class="countdown-wrap hidden" id="live-details" aria-label="العد التنازلي للمناسبة">
<h1 class="kicker">باقي على المناسبة</h1>
<div class="countdown" aria-live="off">
<div class="unit"><span class="num" id="days">--</span><span class="label">يوم</span></div>
<div class="unit"><span class="num" id="hours">--</span><span class="label">ساعة</span></div>
<div class="unit"><span class="num" id="minutes">--</span><span class="label">دقيقة</span></div>
<div class="unit"><span class="num" id="seconds">--</span><span class="label">ثانية</span></div>
</div>
</section>
</main>
<script>
(()=> {
 const one=document.getElementById('page-one'),two=document.getElementById('page-two'),count=document.getElementById('live-details');
 let timer=null;
 function runClock(){
  if(timer)return;
  const target=new Date('2026-12-08T17:30:00+03:00').getTime();
  function tick(){
   const diff=Math.max(0,target-Date.now());
   const values={days:Math.floor(diff/86400000),hours:Math.floor(diff%86400000/3600000),minutes:Math.floor(diff%3600000/60000),seconds:Math.floor(diff%60000/1000)};
   for(const key in values)document.getElementById(key).textContent=String(values[key]).padStart(2,'0');
  }
  tick();timer=setInterval(tick,1000);
 }
 function showPageTwo(){one.classList.add('hidden');two.classList.remove('hidden');count.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});runClock()}
 function showPageOne(){two.classList.add('hidden');count.classList.add('hidden');one.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});if(timer){clearInterval(timer);timer=null}}
 function route(){location.hash==='#page-two'?showPageTwo():showPageOne()}
 document.querySelector('.open-hotspot').addEventListener('click',e=>{e.preventDefault();history.pushState(null,'','#page-two');route()});
 document.querySelector('.page-back').addEventListener('click',e=>{e.preventDefault();history.pushState(null,'','#page-one');route()});
 window.addEventListener('popstate',route);window.addEventListener('hashchange',route);
 if(location.hash==='#page-two')showPageTwo();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const root=document.getElementById('petals');
  for(let i=0;i<17;i++){const p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.animationDuration=9+Math.random()*12+'s';p.style.animationDelay=-Math.random()*18+'s';root.appendChild(p)}
 }
})();
</script>
</body>
</html>
