<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="دعوة خاصة لمناسبة سعيدة. افتحوا الرابط لاكتشاف التفاصيل.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="دعوة خاصة | A Special Celebration">
  <meta name="twitter:description" content="افتحوا الرابط لاكتشاف التفاصيل.">
  <meta name="twitter:image" content="https://bashar203.github.io/Bashar_Bayan/whatsapp-preview.jpg">
  <title>دعوة خاصة | A Special Celebration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --dusty: #d8b2b6;
      --dusty-deep: #b87985;
      --wine: #824653;
      --wine-dark: #713b49;
      --cream: #fff7f1;
      --gold: #b88a50;
      --gold-soft: #ead4b2;
      --ink: #75434d;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: #e8cdd0; scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; overflow-x: hidden;
      color: var(--ink); font-family: 'Tajawal', sans-serif;
      background: radial-gradient(ellipse at 50% 22%, #fff7f3 0%, #f1dfe0 47%, #d8b2b6 100%);
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    .petal-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 30; }
    .petal {
      position: absolute; top: -36px; width: 13px; height: 21px;
      border-radius: 85% 12% 85% 12%;
      background: linear-gradient(145deg, #fff2ef 0%, #e8b9c0 48%, #c98291 100%);
      box-shadow: 0 2px 7px #89505d30; opacity: .78;
      animation: petal-fall var(--duration) linear var(--delay) infinite;
      will-change: transform;
    }
    @keyframes petal-fall {
      0% { transform: translate3d(0,-8vh,0) rotate(0deg); opacity: 0; }
      9% { opacity: .8; }
      48% { transform: translate3d(var(--drift),52vh,0) rotate(240deg); }
      100% { transform: translate3d(calc(var(--drift) * -.55),110vh,0) rotate(520deg); opacity: .08; }
    }

    /* The approved cover artwork is displayed as-is. Only the invisible hit-area is interactive. */
    .welcome-screen {
      min-height: 100vh; min-height: 100svh; width: 100%; display: grid; place-items: center;
      position: relative; isolation: isolate; padding: 0;
      background: radial-gradient(ellipse at center, #f3dcde 0%, #dfbdc1 72%, #d3aeb4 100%);
    }
    .cover-wrap {
      position: relative; width: min(100vw, 56.25svh); height: min(100svh, 177.7778vw);
      max-width: 100vw; max-height: 100svh; aspect-ratio: 9 / 16;
      display: flex; align-items: center; justify-content: center;
      filter: drop-shadow(0 14px 32px #81505a25);
    }
    .cover-art { display: block; width: 100%; height: 100%; object-fit: contain; }
    .open-hotspot {
      position: absolute; left: 25.5%; top: 77.2%; width: 49%; height: 6.5%;
      border: 0; border-radius: 999px; padding: 0; margin: 0; cursor: pointer;
      background: transparent; color: transparent; opacity: .01;
    }
    .open-hotspot:focus-visible { opacity: 1; background: #ffffff12; outline: 3px solid #fff7e8; outline-offset: 2px; }
    .welcome-hint {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .details-screen {
      display: none; min-height: 100vh; min-height: 100svh; padding: clamp(18px,4vw,42px) 14px 46px;
      background: radial-gradient(ellipse at 50% 8%, #fff8f3 0%, #f4e4e2 48%, #dfbdc1 100%);
      animation: reveal .7s ease both;
    }
    .details-screen.is-visible { display: block; }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .details-inner { width: min(100%, 660px); margin: 0 auto; }
    .invitation-art-frame {
      padding: 5px; border: 1px solid var(--gold); border-radius: 3px;
      background: linear-gradient(135deg, #f9ebd5, #b88a50 48%, #f4dfc0);
      box-shadow: 0 14px 36px #875a6120;
    }
    .invitation-art { display: block; width: 100%; height: auto; object-fit: contain; }
    .below-card { text-align: center; margin: 30px auto 0; }
    .section-kicker { margin: 0 0 7px; color: #a17a65; font: 600 13px 'Tajawal', sans-serif; letter-spacing: .4px; }
    .section-title { margin: 0 0 16px; color: var(--wine); font: 700 clamp(25px,6vw,34px) 'Amiri', serif; }
    .ornament { color: var(--gold); margin: 0 auto 12px; font-size: 20px; }
    .countdown {
      display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 7px;
      width: min(100%, 540px); margin: 0 auto 21px; padding: 12px 9px;
      border: 1px solid #c7a274; border-radius: 18px;
      background: linear-gradient(120deg, #fffaf5d9, #f0d9d9e8);
      box-shadow: 0 8px 24px #93636b13, inset 0 1px #fff;
    }
    .count-unit { min-width: 0; padding: 6px 2px; border-radius: 12px; background: #fff9f5a8; }
    .count-number { display: block; color: var(--wine-dark); font: 700 clamp(25px,7vw,38px) 'Amiri', serif; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .count-label { display: block; margin-top: 3px; color: #987278; font: 14px 'Tajawal', sans-serif; }
    .event-details {
      display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px;
      width: min(100%, 600px); margin: 0 auto;
    }
    .detail-item {
      min-width: 0; padding: 13px 7px; border-inline-start: 1px solid #d8bfa6;
      color: var(--wine); background: #fff9f5a3; border-radius: 13px;
    }
    .detail-item:first-child { border-inline-start: 0; }
    .detail-icon { display: block; color: var(--gold); font-size: 22px; margin-bottom: 5px; }
    .detail-label { display: block; color: #a17a65; font-size: 12px; margin-bottom: 4px; }
    .detail-value { display: block; font: 700 clamp(13px,3.6vw,17px) 'Amiri', serif; line-height: 1.45; overflow-wrap: anywhere; }
    .map-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: min(100%, 330px); min-height: 52px; margin: 19px auto 0; padding: 12px 22px;
      border: 1px solid #f7e5ca; border-radius: 999px; color: #fffaf6; text-decoration: none;
      background: linear-gradient(115deg, #bd8490, #965b69);
      box-shadow: 0 8px 20px #87515e25, inset 0 1px #ffffff88;
      font: 600 17px 'Tajawal', sans-serif; transition: transform .2s, box-shadow .2s;
    }
    .map-button:hover { transform: translateY(-2px); box-shadow: 0 11px 25px #87515e32; }
    .map-button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .closing { margin: 23px auto 0; color: var(--wine); font: 700 clamp(20px,5vw,25px) 'Amiri', serif; line-height: 1.7; }
    .closing-ornament { color: var(--gold); margin-top: 5px; font-size: 20px; }
    .back-button {
      display: block; margin: 20px auto 0; padding: 8px 18px; border: 1px solid #c8a57d;
      border-radius: 999px; color: #87535d; background: #fff8f2a6; font: 500 14px 'Tajawal', sans-serif; cursor: pointer;
    }
    @media (max-width: 420px) {
      .details-screen { padding-inline: 10px; }
      .invitation-art-frame { padding: 3px; }
      .countdown { gap: 4px; padding: 8px 5px; }
      .count-label { font-size: 12px; }
      .detail-item { padding: 10px 4px; }
      .detail-label { font-size: 11px; }
    }
    @media (min-width: 760px) {
      .welcome-screen { padding: 16px; }
      .cover-wrap { border-radius: 2px; }
      .details-screen { padding-top: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

  <section class="welcome-screen" id="welcomeScreen" aria-label="الصفحة الأولى من الدعوة">
    <div class="cover-wrap">
      <img class="cover-art" src="page-one.jpg" width="864" height="1536" alt="الصفحة الأولى من دعوة الخطوبة">
      <button class="open-hotspot" id="openInvitation" type="button" aria-label="افتح الدعوة"><span class="welcome-hint">افتح الدعوة</span></button>
    </div>
  </section>

  <main class="details-screen" id="detailsScreen" aria-label="تفاصيل المناسبة" aria-hidden="true">
    <div class="details-inner">
      <div class="invitation-art-frame">
        <img class="invitation-art" src="page-two.jpg" width="1024" height="1536" alt="بطاقة دعوة بشار وبيان وتفاصيل المناسبة كما اعتمدتها العائلتان">
      </div>

      <section class="below-card" aria-labelledby="countdownHeading">
        <p class="section-kicker">A SPECIAL CELEBRATION</p>
        <h1 class="section-title" id="countdownHeading">العدّ التنازلي للمناسبة</h1>
        <div class="ornament" aria-hidden="true">❧ ❀ ❧</div>
        <div class="countdown" role="timer" aria-live="off" aria-label="الوقت المتبقي حتى موعد المناسبة">
          <div class="count-unit"><span class="count-number" id="days">--</span><span class="count-label">يوم</span></div>
          <div class="count-unit"><span class="count-number" id="hours">--</span><span class="count-label">ساعة</span></div>
          <div class="count-unit"><span class="count-number" id="minutes">--</span><span class="count-label">دقيقة</span></div>
          <div class="count-unit"><span class="count-number" id="seconds">--</span><span class="count-label">ثانية</span></div>
        </div>

        <div class="event-details" aria-label="تاريخ ووقت ومكان المناسبة">
          <div class="detail-item">
            <span class="detail-icon" aria-hidden="true">◷</span>
            <span class="detail-label">الوقت</span>
            <strong class="detail-value">5:30 مساءً<br>حتى 8:00 مساءً</strong>
          </div>
          <div class="detail-item">
            <span class="detail-icon" aria-hidden="true">▦</span>
            <span class="detail-label">التاريخ</span>
            <strong class="detail-value">الثلاثاء<br>8 ديسمبر 2026</strong>
          </div>
          <div class="detail-item">
            <span class="detail-icon" aria-hidden="true">⌖</span>
            <span class="detail-label">القاعة</span>
            <strong class="detail-value">قاعات كريستال<br>عمّان، الأردن</strong>
          </div>
        </div>

        <a class="map-button" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">⌖</span> موقع القاعة على الخريطة
        </a>
        <p class="closing">بارك الله لهما وبارك عليهما<br>وجمع بينهما في خير</p>
        <div class="closing-ornament" aria-hidden="true">❧ ❀ ❧</div>
        <button class="back-button" id="backToCover" type="button">العودة إلى الغلاف</button>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const welcome = document.getElementById('welcomeScreen');
      const details = document.getElementById('detailsScreen');
      const openButton = document.getElementById('openInvitation');
      const backButton = document.getElementById('backToCover');

      function openDetails() {
        welcome.hidden = true;
        details.classList.add('is-visible');
        details.setAttribute('aria-hidden', 'false');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      function showCover() {
        details.classList.remove('is-visible');
        details.setAttribute('aria-hidden', 'true');
        welcome.hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      openButton.addEventListener('click', openDetails);
      backButton.addEventListener('click', showCover);

      // The event time is Amman local time (UTC+03:00).
      const eventTime = new Date('2026-12-08T17:30:00+03:00').getTime();
      const fields = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
      };
      const pad = value => String(value).padStart(2, '0');
      function updateCountdown() {
        const remaining = Math.max(0, eventTime - Date.now());
        const days = Math.floor(remaining / 86400000);
        const hours = Math.floor((remaining % 86400000) / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        fields.days.textContent = String(days);
        fields.hours.textContent = pad(hours);
        fields.minutes.textContent = pad(minutes);
        fields.seconds.textContent = pad(seconds);
        if (remaining === 0) {
          document.getElementById('countdownHeading').textContent = 'اليوم موعد فرحتنا';
        }
      }
      updateCountdown();
      window.setInterval(updateCountdown, 1000);

      // Decorative petals are separate DOM elements and never alter either approved image.
      const layer = document.getElementById('petalLayer');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        for (let i = 0; i < 22; i += 1) {
          const petal = document.createElement('i');
          petal.className = 'petal';
          petal.style.left = `${Math.random() * 100}%`;
          petal.style.setProperty('--duration', `${13 + Math.random() * 15}s`);
          petal.style.setProperty('--delay', `${-Math.random() * 28}s`);
          petal.style.setProperty('--drift', `${Math.round(Math.random() * 130 - 65)}px`);
          petal.style.width = `${10 + Math.random() * 8}px`;
          petal.style.height = `${16 + Math.random() * 12}px`;
          layer.appendChild(petal);
        }
      }
    })();
  </script>
</body>
</html>
