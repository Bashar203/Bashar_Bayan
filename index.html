<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c99da1">
<title>دعوة خاصة | بشار وأميرته</title>
<meta name="description" content="يسعدنا حضوركم ومشاركتنا فرحتنا. افتحوا الرابط لاكتشاف الدعوة.">
<meta property="og:type" content="website">
<meta property="og:title" content="دعوة خاصة لمناسبة سعيدة">
<meta property="og:description" content="يسعدنا حضوركم ومشاركتنا فرحتنا. افتحوا الرابط لاكتشاف الدعوة.">
<meta property="og:image" content="https://bashar203.github.io/Bashar_Bayan/whatsapp-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--dusty:#c99da1;--dusty-deep:#b77f89;--wine:#783b49;--gold:#c49a61;--cream:#f8e9e3}
*{box-sizing:border-box}
html{min-height:100%;background:#c99da1;scroll-behavior:smooth}
body{margin:0;min-height:100svh;color:var(--wine);font-family:"Noto Naskh Arabic",Amiri,Georgia,serif;background:radial-gradient(ellipse at 50% 25%,#f2dddd 0%,#dfbabe 60%,#c99da1 100%);overflow-x:hidden}
main{position:relative;z-index:1;width:100%;padding:clamp(8px,2vw,24px) 10px 34px;display:flex;flex-direction:column;align-items:center;gap:16px}
.invitation{position:relative;width:min(100%,560px);line-height:0;filter:drop-shadow(0 12px 24px rgba(92,43,51,.20))}
.invitation>img{display:block;width:100%;height:auto;border-radius:2px}
.hidden{display:none!important}
.hotspot{position:absolute;display:block;z-index:5;border-radius:60px;background:transparent;outline-offset:3px}
.hotspot:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--gold)}
.open-hotspot{left:25%;top:78.5%;width:50%;height:6.5%}
.map-hotspot{left:25%;top:78.8%;width:50%;height:7%;cursor:pointer}
.page-back{position:absolute;z-index:8;top:4.2%;left:7.5%;right:auto;width:10%;height:5.5%;display:block;border:0;border-radius:0;background:transparent;text-decoration:none;box-shadow:none}
.countdown-wrap{position:relative;isolation:isolate;overflow:hidden;width:min(calc(100% - 24px),490px);margin:0 auto 22px;padding:20px 16px 19px;text-align:center;border:2px solid #c49a61;border-radius:26px;background:linear-gradient(145deg,#f8e9e3 0%,#edcfcc 52%,#dfb7b8 100%);box-shadow:inset 0 0 0 5px rgba(255,252,247,.78),inset 0 0 0 7px rgba(190,148,94,.25),0 12px 28px rgba(105,54,62,.17)}
.countdown-wrap:before{content:"";position:absolute;inset:7px;border:1px solid rgba(190,148,94,.65);border-radius:19px;pointer-events:none;z-index:-1}
.kicker{display:inline-block;margin:0 0 13px;padding:5px 24px 7px;border:1px solid rgba(190,148,94,.95);border-radius:999px;background:linear-gradient(180deg,#bd8790,#914c58);box-shadow:0 3px 9px #69363b2b,inset 0 1px 0 #ffffff55;font-size:clamp(17px,4vw,22px);font-weight:700;color:#fff8f0}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;direction:rtl;padding:9px;border:1px solid rgba(190,148,94,.9);border-radius:18px;background:#fff8f0a8;box-shadow:inset 0 2px 8px #75404510}
.unit{min-width:0;padding:11px 3px 10px;border:1.5px solid #be945e;border-radius:13px;background:linear-gradient(180deg,#914c58,#743643);box-shadow:0 4px 9px #6e3b4328,inset 0 1px 0 #ffffff55}
.num{display:block;font:700 clamp(25px,7vw,38px)/1.1 Georgia,serif;color:#fff7ef;font-variant-numeric:tabular-nums}
.label{display:block;margin-top:6px;font-size:13px;font-weight:700;color:#f9e8df}
.petal{position:fixed;top:-12vh;z-index:9;pointer-events:none;width:15px;height:26px;border-radius:90% 8% 90% 8%;background:linear-gradient(135deg,#f7c8ce,#d78391 55%,#a95769);opacity:.68;box-shadow:inset 2px 1px 3px #ffffffa6,0 2px 5px #5f2a351f;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}50%{transform:translate3d(42px,55vh,0) rotate(210deg)}100%{transform:translate3d(-30px,115vh,0) rotate(420deg)}}
@media(min-width:900px){main{padding-top:24px}.invitation{width:min(48vw,560px)}}
@media(max-width:430px){main{padding:0 0 20px;gap:13px}.invitation{width:100%;filter:none}.page-back{top:4.2%;left:7.5%;width:10%;height:5.5%}.countdown-wrap{width:calc(100% - 30px);padding:18px 11px 16px;margin-bottom:18px}.countdown{gap:6px;padding:7px}.unit{padding:10px 2px 9px}.num{font-size:clamp(23px,7.1vw,31px)}.label{font-size:12px}}
@media(prefers-reduced-motion:reduce){.petal{display:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main>
<section class="invitation" id="page-one" aria-label="الصفحة الأولى من الدعوة">
<img src="page1.jpg" width="864" height="1536" alt="الصفحة الأولى من الدعوة">
<a class="hotspot open-hotspot" href="#page-two" aria-label="افتح الدعوة"></a>
</section>
<section class="invitation hidden" id="page-two" aria-label="الصفحة الثانية من الدعوة">
<a class="page-back" href="#page-one" aria-label="العودة للصفحة الأولى" title="العودة للصفحة الأولى"></a>
<img src="page2.jpg" width="864" height="1210" alt="تفاصيل دعوة الخطوبة">
<a class="hotspot map-hotspot" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener" aria-label="افتح موقع قاعات كريستال على الخريطة"></a>
</section>
<section class="countdown-wrap hidden" id="live-details" aria-label="العد التنازلي للمناسبة">
<h1 class="kicker">باقي على المناسبة</h1>
<div class="countdown" aria-live="off">
<div class="unit"><span class="num" id="days">--</span><span class="label">يوم</span></div>
<div class="unit"><span class="num" id="hours">--</span><span class="label">ساعة</span></div>
<div class="unit"><span class="num" id="minutes">--</span><span class="label">دقيقة</span></div>
<div class="unit"><span class="num" id="seconds">--</span><span class="label">ثانية</span></div>
</div>
</section>
</main>
<script>
(()=> {
 const one=document.getElementById('page-one'),two=document.getElementById('page-two'),count=document.getElementById('live-details');
 let timer=null;
 function runClock(){
  if(timer)return;
  const target=new Date('2026-12-08T17:30:00+03:00').getTime();
  function tick(){
   const diff=Math.max(0,target-Date.now());
   const values={days:Math.floor(diff/86400000),hours:Math.floor(diff%86400000/3600000),minutes:Math.floor(diff%3600000/60000),seconds:Math.floor(diff%60000/1000)};
   for(const key in values)document.getElementById(key).textContent=String(values[key]).padStart(2,'0');
  }
  tick();timer=setInterval(tick,1000);
 }
 function showPageTwo(){one.classList.add('hidden');two.classList.remove('hidden');count.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});runClock()}
 function showPageOne(){two.classList.add('hidden');count.classList.add('hidden');one.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});if(timer){clearInterval(timer);timer=null}}
 function route(){location.hash==='#page-two'?showPageTwo():showPageOne()}
 document.querySelector('.open-hotspot').addEventListener('click',e=>{e.preventDefault();history.pushState(null,'','#page-two');route()});
 document.querySelector('.page-back').addEventListener('click',e=>{e.preventDefault();history.pushState(null,'','#page-one');route()});
 window.addEventListener('popstate',route);window.addEventListener('hashchange',route);
 if(location.hash==='#page-two')showPageTwo();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const root=document.getElementById('petals');
  for(let i=0;i<17;i++){const p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.animationDuration=9+Math.random()*12+'s';p.style.animationDelay=-Math.random()*18+'s';root.appendChild(p)}
 }
})();
</script>
</body>
</html>
