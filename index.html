<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8eeeb"><title>دعوة خطوبة بشار وبيان</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rose:#C48B96;--rose-deep:#B87B83;--rose-ink:#94545e;--rose-light:#efd6d7;--ivory:#fff9f5;--cream:#fbf1ed;--gold:#bd965e;--gold-light:#e7d0a7;--text:#76565a}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--text);font-family:"Readex Pro",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 12%,#fffaf7 0,#f7e9e7 53%,#eed6d7 100%)}
body:after{content:"";position:fixed;inset:13px;z-index:6;pointer-events:none;border:1px solid #bd965e55}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.petal{position:absolute;top:-12vh;width:13px;height:21px;border-radius:80% 10% 80% 10%;background:linear-gradient(135deg,#f8e5e5,#C48B96 75%);opacity:.4;filter:drop-shadow(0 2px 4px #94545e18);animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(680deg)}}
.gold-dust{position:fixed;inset:0;pointer-events:none;z-index:4;background-image:radial-gradient(#bd965e 1px,transparent 1.5px);background-size:83px 97px;opacity:.08;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
.intro-screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#f1d9d9,#d6a9af 58%,#C48B96 100%);transition:opacity 1s,visibility 1s}
.intro-screen.hide{opacity:0;visibility:hidden;pointer-events:none}.intro-box{text-align:center;max-width:420px}
.intro-kicker{font-family:Amiri,serif;color:#fff8f0;font-size:24px}
.seal{width:112px;height:112px;margin:28px auto 24px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#f2d9d4,#C48B96 65%,#a96874);border:5px double #f3dfc1;box-shadow:0 12px 30px #86515a35,inset 0 0 0 4px #ffffff38;color:#fffaf3;font:56px Georgia,serif}
.primary{border:1px solid #f1dfc1;border-radius:999px;padding:13px 29px;background:linear-gradient(120deg,#d5a5aa,#B87B83);color:#fffaf5;font:500 15px "Readex Pro";cursor:pointer;box-shadow:0 8px 24px #8d596025;transition:transform .25s}.primary:hover{transform:translateY(-3px)}
main{width:min(100% - 28px,720px);margin:0 auto;padding:38px 0 60px;opacity:0;transform:translateY(35px);transition:opacity 1.1s,transform 1.1s}main.visible{opacity:1;transform:none}
.header{text-align:center;margin:0 0 24px}.header .eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px}.header h1{font:400 clamp(30px,6vw,46px) Amiri,serif;color:var(--rose-ink);margin:8px 0}.header p{color:#98777a;font-size:13px;margin:0}
.art-frame{position:relative;padding:8px;border:1px solid var(--gold);background:linear-gradient(135deg,#f4e3c5,#bd965e,#f3dfbd);box-shadow:0 22px 55px #9c70701f;border-radius:3px;overflow:hidden}
.art-frame:before{content:"";position:absolute;inset:13px;border:1px solid #fff0d3;z-index:2;pointer-events:none}
.artwork{display:block;width:100%;height:auto;opacity:0;transform:scale(1.025);transition:transform 1.2s ease,opacity 1s}.visible .artwork{transform:scale(1);opacity:1}
.art-frame:after{content:"";position:absolute;inset:-40% -80%;background:linear-gradient(110deg,transparent 42%,#fff7 50%,transparent 58%);transform:translateX(-100%);pointer-events:none}.visible .art-frame:after{animation:shine 2.2s 1s ease forwards}@keyframes shine{to{transform:translateX(100%)}}
.map-hotspot{position:absolute;z-index:3;left:32%;top:78.7%;width:36%;height:4.5%;border-radius:50px;display:block}.map-hotspot:focus{outline:3px solid #fff;outline-offset:3px}
.below{margin:28px auto 0;text-align:center}.below-title{font:25px Amiri;color:var(--rose-ink);margin:0 0 14px}
.countdown{display:flex;justify-content:center;gap:9px;direction:ltr;flex-wrap:wrap}.unit{width:76px;padding:11px 5px;border:1px solid #d6b6a0;background:#fffaf5a8;backdrop-filter:blur(6px);border-radius:4px}
.unit b{display:block;font-size:24px;font-weight:500;color:var(--rose-ink);font-variant-numeric:tabular-nums}.unit span{font-size:10px;color:#98777a}
.map-cta{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:12px 24px;border:1px solid var(--gold);border-radius:999px;color:#fffaf5;background:linear-gradient(120deg,#D5A4AA,#B87B83);text-decoration:none;font-size:13px;transition:.25s;box-shadow:0 6px 18px #b87b8325}.map-cta:hover{transform:translateY(-2px)}
.footer{margin-top:25px;color:var(--rose-ink);font:21px Amiri}.note{font-size:10px;color:#a78983;margin-top:18px;letter-spacing:.04em}
@media(max-width:560px){main{width:min(100% - 18px,500px);padding-top:24px}.art-frame{padding:5px}.art-frame:before{inset:9px}.unit{width:64px}.map-hotspot{left:32%;width:36%;top:78.7%;height:4.5%}.header p{line-height:1.8}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<div class="ambient" id="petals"></div><div class="gold-dust"></div>
<section class="intro-screen" id="intro"><div class="intro-box"><div class="intro-kicker">بكل الحب… دعوة خاصة لكم</div><div class="seal" aria-hidden="true">B</div><button class="primary" id="openBtn">افتح الدعوة ✦</button></div></section>
<main id="invitation">
<header class="header"><div class="eyebrow">A SPECIAL CELEBRATION</div><h1>بشار &amp; بيان</h1><p>يسعدنا أن تشاركونا فرحتنا في هذه المناسبة الجميلة</p></header>
<div class="art-frame"><img class="artwork" src="invitation-card.jpg" alt="بطاقة دعوة خطوبة بشار وبيان"><a class="map-hotspot" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener" aria-label="افتح موقع قاعات كريستال على الخريطة" title="موقع القاعة"></a></div>
<section class="below"><h2 class="below-title">ننتظركم لنشارككم فرحتنا</h2>
<div class="countdown" aria-label="الوقت المتبقي"><div class="unit"><b id="days">--</b><span>Days</span></div><div class="unit"><b id="hours">--</b><span>Hours</span></div><div class="unit"><b id="minutes">--</b><span>Minutes</span></div><div class="unit"><b id="seconds">--</b><span>Seconds</span></div></div>
<a class="map-cta" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener">⌖ &nbsp; افتح موقع القاعة على Google Maps</a>
<div class="footer">بارك الله لهما وبارك عليهما وجمع بينهما في خير</div><div class="note">08 December 2026 · Amman, Jordan</div></section></main>
<script>
const intro=document.getElementById('intro'),main=document.getElementById('invitation');
document.getElementById('openBtn').addEventListener('click',()=>{intro.classList.add('hide');main.classList.add('visible');setTimeout(()=>main.scrollIntoView({behavior:'smooth',block:'start'}),250);});
const target=new Date('2026-12-08T17:30:00+03:00').getTime();
function updateCountdown(){const diff=Math.max(0,target-Date.now());const values={days:Math.floor(diff/86400000),hours:Math.floor(diff%86400000/3600000),minutes:Math.floor(diff%3600000/60000),seconds:Math.floor(diff%60000/1000)};for(const [id,value] of Object.entries(values))document.getElementById(id).textContent=String(value).padStart(2,'0');}
updateCountdown();setInterval(updateCountdown,1000);
const petalHost=document.getElementById('petals');for(let i=0;i<12;i++){const p=document.createElement('i');p.className='petal';p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(16+Math.random()*20)+'s';p.style.animationDelay=(-Math.random()*28)+'s';p.style.setProperty('--drift',(Math.random()*120-60)+'px');p.style.opacity=(.18+Math.random()*.35);p.style.transform='scale('+(0.5+Math.random()*.65)+')';petalHost.appendChild(p);}
</script></body></html>
